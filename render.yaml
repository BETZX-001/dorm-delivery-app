services:
  - type: web
    name: hiu-dorm-delivery-api
    runtime: node
    plan: free
    rootDir: back-end
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PASSWORD_FINGERPRINT_SECRET
        generateValue: true

  - type: web
    name: hiu-dorm-delivery-web
    runtime: static
    rootDir: front-end
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: API_BASE_URL
        value: https://hiu-dorm-delivery-api.onrender.com
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
