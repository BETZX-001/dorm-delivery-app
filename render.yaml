services:
  - type: web
    name: hiu-dorm-delivery-api
    runtime: node
    plan: free
    rootDir: back-end
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PASSWORD_FINGERPRINT_SECRET
        generateValue: true
